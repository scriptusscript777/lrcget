name: Publish release to WinGet
# Inherited from upstream. This fork has no WinGet package or token, and the
# LRCLIB.LRCGET identifier belongs to the original project, so the workflow
# runs only when started manually (Rick, 2026-10-12).
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: LRCLIB.LRCGET
          installers-regex: 'x64_en-US\.msi'
          token: ${{ secrets.WINGET_ACC_TOKEN }}
