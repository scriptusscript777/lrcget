name: Build and check Linux packages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  linux-packages:
    # Ubuntu 24.04 matches the documented Mint 22 / glibc 2.39 baseline.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev ffmpeg xvfb x11-utils file
      - name: Install frontend dependencies and test
        run: |
          npm ci
          npm test
      - name: Test optional alignment setup and Python code quality
        run: |
          python -m pip install ruff
          python -m ruff check alignment
          python -m unittest discover -s alignment -p 'test_*.py'
      - name: Test native backend
        run: |
          # The Tauri build macro needs the built web interface (dist/).
          npm run build
          cd src-tauri && cargo test --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Check committed third-party notices before packaging
        # THIRD_PARTY_NOTICES.md is copied into the .deb and the Windows MSI, so it
        # must match the current dependencies before any installer is built.
        run: |
          python3 tools/third_party_notices.py --output "$RUNNER_TEMP/notices-source.md" \
            --compare THIRD_PARTY_NOTICES.md --check
      - name: Build Debian package and AppImage
        run: npm run tauri -- build --bundles deb,appimage
      - name: Add the AppImage's bundled system libraries to its notices and repackage it
        run: |
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage')
          python3 tools/third_party_notices.py --appimage "$appimage" \
            --output "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md" --check \
            --source-list "$RUNNER_TEMP/appimage-sources.txt"
          cp "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md" THIRD_PARTY_NOTICES.md
          npm run tauri -- build --bundles appimage
          git checkout -- THIRD_PARTY_NOTICES.md
      - name: Download the corresponding source of the AppImage's bundled libraries
        # GPL and LGPL libraries inside the AppImage are distributed with their exact
        # Ubuntu source packages (name=version recorded by the notices generator).
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/AppImage_library_sources"
          cd "$RUNNER_TEMP/AppImage_library_sources"
          while read -r spec; do
            [ -n "$spec" ] || continue
            "$GITHUB_WORKSPACE/packaging/linux/fetch-source.sh" "$spec"
          done < "$RUNNER_TEMP/appimage-sources.txt"
          expected=$(grep -c . "$RUNNER_TEMP/appimage-sources.txt")
          found=$(find . -maxdepth 1 -name '*.dsc' | wc -l)
          [ "$found" -eq "$expected" ] || { echo "Expected $expected source packages, found $found" >&2; exit 1; }
          cp "$RUNNER_TEMP/appimage-sources.txt" SOURCE_PACKAGES.txt
          printf '%s\n' \
            'Corresponding source of the Ubuntu 24.04 libraries bundled in the LRCGET AppImage.' \
            'Each package is the unmodified Ubuntu source package listed in SOURCE_PACKAGES.txt.' \
            'Unpack one with: dpkg-source -x <package>_<version>.dsc' > README.txt
          du -sh .
      - name: Collect packages, notices, sources and checksums
        run: |
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          mkdir -p packages
          tar -cf "packages/LRCGET_${version}_AppImage_library_sources.tar" \
            -C "$RUNNER_TEMP" AppImage_library_sources
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage packages/
          cp "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md" packages/THIRD_PARTY_NOTICES.md
          cd packages
          for file in *.deb *.AppImage *.tar; do sha256sum "$file" > "$file.sha256"; done
          ls -l
      - name: Download the currently published Debian package for the upgrade check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-deb
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*_amd64.deb' --dir previous-deb
          test "$(find previous-deb -name '*.deb' | wc -l)" -eq 1
      - name: Check Debian upgrade, launch, license files, removal and AppImage
        run: |
          # Build the font cache first so the first app launch is not slowed by it.
          fc-cache -f >/dev/null
          df -h . /tmp
          ./packaging/linux/check-packages.sh packages previous-deb/*.deb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-packages-results
          path: packages/
          if-no-files-found: warn
