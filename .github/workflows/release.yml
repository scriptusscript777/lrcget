name: Release installers

# Builds and tests the Windows MSI and Linux packages with the existing check
# workflows, then publishes them only if every check passed. Start it manually
# from the Actions tab after committing the release (version, CHANGELOG.md,
# docs/releases/<version>.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v2.2.8 (must contain the app version)'
        required: true
        type: string
      draft:
        description: 'Create a new release as a draft to review before publishing'
        type: boolean
        default: true
      sign_msi:
        description: 'Use the SignPath-signed MSI (requires the configured SignPath project)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/windows-msi.yml
    with:
      sign_msi: ${{ inputs.sign_msi }}
    secrets: inherit
    permissions:
      contents: read
      actions: read

  linux:
    uses: ./.github/workflows/linux-packages.yml
    permissions:
      contents: read
      actions: read

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.sign_msi && 'windows-msi-signed-results' || 'windows-msi-results' }}
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-results
          path: linux
      - name: Collect installers, archives and checksums
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          case "$TAG" in
            *"$version"*) ;;
            *) echo "Tag $TAG does not contain the app version $version." >&2; exit 1 ;;
          esac
          mkdir release
          cp "$(find windows -name "LRCGET_${version}_x64_en-US.msi")" release/
          cp linux/"LRCGET_${version}_amd64.deb" linux/"LRCGET_${version}_amd64.AppImage" \
            linux/"LRCGET_${version}_AppImage_library_sources.tar" release/
          git archive --format=zip --prefix=lrcget/ -o "release/LRCGET_${version}_source.zip" HEAD
          git archive --format=tar.gz --prefix=lrcget/ -o "release/LRCGET_${version}_source.tar.gz" HEAD
          mkdir -p stage/lrcget-guides
          git archive HEAD AGENTS.md LICENSE LOCAL_CHANGES.md CHANGELOG.md README.md docs packaging | tar x -C stage/lrcget-guides
          # Notices generated by linux-packages.yml for these exact builds, including
          # the AppImage's bundled system libraries; that job fails on unreviewed licenses.
          cp linux/THIRD_PARTY_NOTICES.md stage/lrcget-guides/THIRD_PARTY_NOTICES.md
          cp linux/THIRD_PARTY_NOTICES.md "release/LRCGET_${version}_THIRD_PARTY_NOTICES.md"
          (cd stage && zip -qr "../release/LRCGET_${version}_docs.zip" lrcget-guides)
          cd release
          files=("LRCGET_${version}_amd64.deb" "LRCGET_${version}_amd64.AppImage" "LRCGET_${version}_x64_en-US.msi"
                 "LRCGET_${version}_source.zip" "LRCGET_${version}_source.tar.gz" "LRCGET_${version}_docs.zip"
                 "LRCGET_${version}_THIRD_PARTY_NOTICES.md" "LRCGET_${version}_AppImage_library_sources.tar")
          for file in "${files[@]}"; do sha256sum "$file" > "$file.sha256"; cat "$file.sha256"; done > "LRCGET_${version}_SHA256SUMS.txt"
          sha256sum -c "LRCGET_${version}_SHA256SUMS.txt"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -l
      - name: Publish to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same-version maintenance build: replace the files, keep the notes.
            gh release upload "$TAG" release/* --clobber
          else
            notes="docs/releases/${VERSION}.md"
            [ -f "$notes" ] || { echo "Missing $notes release notes." >&2; exit 1; }
            # Release notes link to guides relatively; point them at this commit on GitHub.
            sed "s#](\.\./#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/#g" "$notes" > release-notes.md
            notes=release-notes.md
            draft_flag=()
            [ "$DRAFT" = "true" ] && draft_flag=(--draft)
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "LRCGET $VERSION" \
              --notes-file "$notes" "${draft_flag[@]}"
          fi
          gh release view "$TAG" --json assets -q '.assets[].name'
