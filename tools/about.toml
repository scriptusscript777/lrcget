# Licenses accepted for crates bundled in LRCGET (used by tools/third_party_notices.py).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
    "NCSA",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# dlopen2 points to a LICENSE file instead of an SPDX id; the file is the MIT
# license (reviewed 2026-10-12). The checksum makes cargo-about fail if it changes.
[dlopen2.clarify]
license = "MIT"
[[dlopen2.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "39fa265207450e77c62e90c5594a06c085b655d8374c7ced4bf7894b6bd95dd2"

[dlopen2_derive.clarify]
license = "MIT"
[[dlopen2_derive.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "39fa265207450e77c62e90c5594a06c085b655d8374c7ced4bf7894b6bd95dd2"

# adler32's LICENSE adds a copyright header to the zlib text; use the file itself
# so the notice keeps "(C) 2016 Remi Rampin and adler32-rs contributors".
[adler32.clarify]
license = "Zlib"
[[adler32.clarify.files]]
path = "LICENSE"
license = "Zlib"
checksum = "f5af8beef8f5f88f1b78494703bbfa019c4f3630ac111344390d6f9975ab22ed"
